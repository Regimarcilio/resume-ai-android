name: CI Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  GRADLE_VERSION: '8.7'

jobs:
  build-core:
    name: Build Core Modules
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle (no cache)
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.caching=false" >> ~/.gradle/gradle.properties
          echo "org.gradle.configuration-cache=false" >> ~/.gradle/gradle.properties

      - name: Build core modules
        run: ./gradlew :core:domain:assemble :core:data:assemble :core:ai:assemble --no-daemon --no-configuration-cache

      - name: Upload core artifacts
        uses: actions/upload-artifact@v4
        with:
          name: core-modules
          path: |
            core/domain/build/outputs/aar/*.aar
            core/data/build/outputs/aar/*.aar
            core/ai/build/outputs/aar/*.aar

  build-app:
    name: Build App (Minimal)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build-core
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle (no cache)
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.caching=false" >> ~/.gradle/gradle.properties
          echo "org.gradle.configuration-cache=false" >> ~/.gradle/gradle.properties

      - name: Download core artifacts
        uses: actions/download-artifact@v4
        with:
          name: core-modules
          path: artifacts

      - name: Install core artifacts to local maven
        run: |
          for file in artifacts/*.aar; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              module=$(echo "$filename" | sed 's/.*-\(.*\)-[0-9].*\.aar/\1/')
              echo "Installing $filename as $module"
              mvn install:install-file -Dfile="$file" -DgroupId=com.resumeapp -DartifactId="$module" -Dversion=1.0.0 -Dpackaging=aar -DgeneratePom=true
            fi
          done

      - name: Build minimal app
        run: ./gradlew :app:assembleDebug --no-daemon --no-configuration-cache --continue

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  build-full:
    name: Build Full App
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: false  # Disable until feature modules are fixed
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle (no cache)
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.caching=false" >> ~/.gradle/gradle.properties
          echo "org.gradle.configuration-cache=false" >> ~/.gradle/gradle.properties

      - name: Run all checks and build
        run: ./gradlew assembleDebug --no-daemon --no-configuration-cache --continue

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**/*.html

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            **/build/reports/jacoco/**/*.html
            **/build/reports/jacoco/**/*.xml

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    if: failure()
    needs: [build-core, build-app]
    steps:
      - name: Send Slack notification
        if: env.SLACK_WEBHOOK != ''
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          channel: '#ci-cd'
          text: 'Resume AI Builder CI pipeline failed'
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}