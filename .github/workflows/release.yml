name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão (ex: v1.0.0)'
        required: true
        type: string
      changelog:
        description: 'Changelog markdown'
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      - name: Validate Version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [[ ! $VERSION =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Versão inválida: $VERSION (use vX.Y.Z)"
            exit 1
          fi
      - name: Update Version in Gradle
        run: |
          VERSION="${{ github.event.inputs.version }}"
          ./gradlew bumpVersion -PversionName=${VERSION#v} -PversionCode=$(date +%s) --no-daemon
      - name: Build Release AAB
        run: ./gradlew :app:bundleRelease --no-daemon
      - name: Create Git Tag
        run: |
          VERSION="${{ github.event.inputs.version }}"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: "Release ${{ github.event.inputs.version }}"
          body: ${{ github.event.inputs.changelog }}
          files: |
            app/build/outputs/bundle/release/*.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}