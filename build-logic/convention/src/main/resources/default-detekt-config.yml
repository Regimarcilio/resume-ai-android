# Default Detekt Configuration Template
# This file is copied to config/detekt/detekt.yml by detektGenerateConfig task

build:
  maxIssues: 10
  weights:
    complexity: 2
    LongParameterList: 1
    style: 1
    comments: 1

config:
  validation: true
  warnsAsErrors: true

excludes: |
  **/build/**
  **/generated/**
  **/*.kt.metadata

console-reports:
  active: true
  exclude:
    - ProjectStatisticsReport
    - ComplexityReport
    - NotificationReport
    - FindBugsReport
  maxIssuesPerRule: 10

output-reports:
  xml:
    enabled: true
    destination: build/reports/detekt/detekt.xml
  html:
    enabled: true
    destination: build/reports/detekt/detekt.html
  sarif:
    enabled: true
    destination: build/reports/detekt/detekt.sarif
  txt:
    enabled: false

# Rule sets configuration
Complexity:
  ComplexCondition:
    threshold: 4
  ComplexInterface:
    threshold: 10
  ComplexMethod:
    threshold: 15
  LongMethod:
    threshold: 40
  LongParameterList:
    threshold: 6
    ignoreDefaultValues: true
    ignoreDataClasses: true
    ignoreOverridden: true
  NestedBlockDepth:
    threshold: 4
  TooManyFunctions:
    thresholdInFiles: 15
    thresholdInClasses: 15
    thresholdInInterfaces: 15
    thresholdInEnums: 15
    thresholdInObjects: 15
    ignoreDeprecated: false
    ignoreOverridden: false
    ignorePrivate: false

Style:
  MagicNumber:
    ignoreNumbers: -1, 0, 1, 2, 3, 4, 5, 10, 100, 1000
    ignorePropertyDeclaration: true
    ignoreLocalVariableDeclaration: true
    ignoreConstantDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreNamedArgument: true
  MaxLineLength:
    maxLineLength: 120
    excludePackageStatements: true
    excludeImportStatements: true
    excludeCommentStatements: true
  NoTabs: true
  WildcardImport:
    excludeImports:
      - 'androidx.compose.ui.*'
      - 'androidx.compose.material3.*'
      - 'androidx.compose.foundation.*'
      - 'kotlinx.coroutines.*'
  UnusedImports: true
  UnusedPrivateMember:
    allowedNames:
      - 'TAG'
      - 'Companion'
  FunctionNaming:
    ignoreOverridden: true
    ignoreAnnotated: ['Composable', 'Preview', 'HiltAndroidApp', 'AndroidEntryPoint']
  ClassNaming:
    ignoreOverridden: true
  VariableNaming:
    ignoreOverridden: true
    ignoreAnnotated: ['Inject', 'Provides', 'HiltAndroidApp', 'AndroidEntryPoint']
  MemberNameEqualsClassName: true
  ObjectPropertyName: true
  ParameterName:
    ignoreOverridden: true
    ignorePrefix: '_'
  WildcardImport: true

Comments:
  AbsentOrWrongFileLicense:
    licenseTemplateFile: ''
  CommentOverPrivateFunction: false
  CommentOverPrivateProperty: false
  EndOfSentenceFormat:
    endOfSentenceFormat: '.'
  UndocumentedPublicClass:
    ignoreDeprecated: true
    ignoreAnnotated: ['Composable', 'Preview', 'HiltAndroidApp', 'AndroidEntryPoint', 'Serializable', 'Parcelize']
  UndocumentedPublicFunction:
    ignoreOverridden: true
    ignoreAnnotated: ['Composable', 'Preview', 'HiltAndroidApp', 'AndroidEntryPoint']

Naming:
  MatchingDeclarationName:
    ignorePropertyDeclaration: true
  FunctionParameterNaming:
    ignoreOverridden: true
    ignoreAnnotated: ['Inject', 'Provides']
  ClassNaming:
    ignoreOverridden: true
  PackageNaming: true

Exceptions:
  TooGenericExceptionCaught: true
  ThrowingExceptionFromFinally: true
  ThrowingExceptionsWithoutMessageOrCause: true
  NotImplementedExceptionRaised: true

PotentialBugs:
  NullSafeCollectionOperators: true
  UnsafeCallOnNullableType: true
  UnsafeCast: true
  ReturnFromFinally: true
  LateinitUsage: true

# Android-specific rules
Android:
  ViewBindingBindingName:
    ignoreLayouts: []
  UnusedResources:
    enabled: true
  UselessViewBinding:
    enabled: true

# Performance rules
Performance:
  ArrayPrimitive: true
  SpreadOperator: true
  ForLoop: true

# Formatting rules
Formatting:
  Indentation:
    indentSize: 4
    continuationIndentSize: 4
  MaximumLineLength:
    maxLineLength: 120
  NoMultipleSpaces: true
  NoWildcardImports: true
  PackageImportLayout: true
  TrailingComma:
    mandatory: true

# Rules for Compose
Compose:
  ComposableNaming:
    ignoreAnnotated: ['Preview']
  PreviewPublic: true
  RememberObservableState:
    enabled: true

# Disable some rules that conflict with our architecture
Style:
  ExplicitCollectionElementAccessMethod:
    enabled: false
  ReturnCount:
    max: 8
  NamedArguments:
    enabled: false
  MandatoryBracesIfStatements:
    enabled: true
  MandatoryBracesLoops:
    enabled: true
  SafeCast:
    enabled: false
  RedundantExplicitType:
    enabled: false
  WildcardImport:
    enabled: true

PotentialBugs:
  UnnecessaryNotNullOperator:
    enabled: true

# Disable rules for generated code
Compose:
  ComposableNaming:
    ignoreAnnotated: ['Preview', 'Composable']