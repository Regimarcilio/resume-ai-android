services:
  mock-ai-gateway:
    build: .
    ports:
      - "8081:8080"
    environment:
      - GATEWAY_PORT=8080
      - GATEWAY_API_KEY=dev-key-change-in-prod
      - LOG_LEVEL=DEBUG
      - CACHE_TTL_SECONDS=3600
      - GUARDRAIL_ENABLED=true
      - TRACE_ENABLED=true
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s
    command: redis-server --bind 0.0.0.0 --protected-mode no

volumes:
  redis_data: