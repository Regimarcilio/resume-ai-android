# Project-wide Gradle settings
# IDE (e.g. Android Studio) users: settings in this file override IDE settings

# JVM args for Gradle daemon
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp

# Parallel execution
org.gradle.parallel=true
org.gradle.workers.max=4

# Caching - DISABLE configuration cache to avoid version catalog issues
org.gradle.caching=true
org.gradle.configuration-cache=false

# Android
android.nonTransitiveRClass=true
android.enableR8.fullMode=true
android.defaults.buildfeatures.buildconfig=true
android.defaults.buildfeatures.aidl=true
android.defaults.buildfeatures.renderscript=false

# Kotlin
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
kotlin.daemon.jvm.options=-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError

# KSP
ksp.incremental=true
ksp.incremental.interop=true

# Build cache
android.buildCache.enabled=true

# R8 / ProGuard
android.enableR8=true
android.enableR8.libraries=true

# Experimental flags (use with caution)
# android.experimental.featureFlags=true

# Version catalog (libs.versions.toml managed separately)
# See gradle/libs.versions.toml