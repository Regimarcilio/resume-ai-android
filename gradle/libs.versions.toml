# PDF
pdfbox-android = { group = "org.apache.pdfbox", name = "pdfbox-android", version.ref = "pdfbox" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlin-test-junit = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit", version.ref = "kotlin" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "activity" }
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "activity" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "activity" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "activity" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
