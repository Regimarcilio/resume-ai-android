# Networking
okhttp = "4.12.0"
retrofit = "2.11.0"
moshi = "1.15.1"
coil = "2.5.0"



# Serialization
kotlinxSerializationJson = "1.6.1"

# PDF
pdfbox = "3.0.2"

# Testing
junit = "4.13.2"
junitJupiter = "5.10.2"
mockk = "1.13.13"
truth = "1.1.5"
robolectric = "4.11"
espresso = "3.5.1"
