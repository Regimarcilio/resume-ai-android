[versions]
# Android
compileSdk = "34"
minSdk = "24"
targetSdk = "34"
jvmTarget = "17"
kotlin = "1.9.22"
kotlinxCoroutines = "1.7.3"
kotlinxSerialization = "1.6.1"
kotlinxDatetime = "0.6.1"
agp = "8.3.0"
composeCompiler = "1.5.10"

# AndroidX
activity = "1.9.0"
appcompat = "1.6.1"
constraintlayout = "2.1.4"
coreKtx = "1.12.0"
datastore = "1.0.0"
fragment = "1.6.2"
lifecycle = "2.7.0"
navigation = "2.7.6"
paging = "3.2.1"
room = "2.6.1"
securityCrypto = "1.1.0-alpha06"
sqlite = "2.4.0"
work = "2.9.0"

# Compose
composeBom = "2024.02.00"
composeUi = "1.6.1"
composeMaterial3 = "1.2.1"
composeFoundation = "1.6.1"
composeAnimation = "1.6.1"
composeRuntime = "1.6.1"
composeNavigation = "2.7.6"
composeCompiler = "1.5.10"

# Hilt
hilt = "2.48"
